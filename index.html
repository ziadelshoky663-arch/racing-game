<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10182b">
  <title>سباق فرعون</title>
  <link rel="stylesheet" href="style-v5.css">
</head>
<body>
  <section id="welcomeScreen" class="welcome-screen">
    <div class="welcome-card">
      <div class="logo">🏁</div>
      <p class="eyebrow">حلبة فرعون</p>
      <h1>أهلاً بيك في<br><span>مجموعة فرعون</span></h1>
      <p>الخاصة بـ <b>زياد الشوكي</b></p>
      <button id="enterGameBtn" class="primary-btn">اختار سباقك 🚗</button>
    </div>
  </section>
  <main id="gameShell" class="game-shell" hidden>
    <header class="topbar">
      <div><p class="eyebrow">حلبة فرعون</p><h1>سباق السرعة <span>🏆</span></h1></div>
      <div class="top-actions">
        <button id="fullscreenBtn" class="icon-btn" title="ملء الشاشة">⛶</button>
        <button id="soundBtn" class="icon-btn" title="الصوت">🔊</button>
        <button id="pauseBtn" class="icon-btn" title="إيقاف مؤقت">Ⅱ</button>
      </div>
    </header>
    <section id="setupPanel" class="setup-panel">
      <div class="setup-heading"><div><p class="eyebrow">جهّز السباق</p><h2>اختار عالمك</h2></div><span class="setup-badge">جاهز للانطلاق</span></div>
      <div class="option-block"><b>المضمار</b><div class="choice-grid theme-choices">
        <button class="choice active" data-theme="day">☀️ <span>نهار<small>سماء صافية</small></span></button>
        <button class="choice" data-theme="night">🌙 <span>ليل<small>أضواء المدينة</small></span></button>
        <button class="choice" data-theme="desert">🏜️ <span>صحراء<small>رمال وغروب</small></span></button>
      </div></div>
      <div class="setup-row">
        <div class="option-block"><b>الوضع</b><div class="segmented"><button class="seg active" data-mode="race">🏆 سباق</button><button class="seg" data-mode="training">🎯 تدريب</button></div></div>
        <div class="option-block"><b>الصعوبة</b><div class="segmented"><button class="seg" data-difficulty="easy">سهل</button><button class="seg active" data-difficulty="normal">عادي</button><button class="seg" data-difficulty="hard">صعب</button></div></div>
        <div class="option-block"><b>اللفات</b><div class="segmented"><button class="seg" data-laps="1">1</button><button class="seg active" data-laps="3">3</button><button class="seg" data-laps="5">5</button></div></div>
      </div>
      <button id="startBtn" class="primary-btn start-btn">ابدأ السباق 🚦</button>
    </section>
    <section id="hud" class="hud" hidden>
      <div><small>اللفة</small><strong id="lapValue">1 / 3</strong></div><div><small>المركز</small><strong id="positionValue">1 / 5</strong></div><div><small>الوقت</small><strong id="timeValue">00:00.0</strong></div>
      <div class="boost-box"><small>نيترو</small><div class="boost-track"><i id="boostBar"></i></div></div>
    </section>
    <section class="track-wrap">
      <canvas id="gameCanvas" width="960" height="600" aria-label="لعبة سباق سيارات"></canvas>
      <div id="countdown" class="countdown" hidden></div><div id="message" class="game-message" hidden></div>
      <div class="controls-hint">الأسهم / WASD <span>•</span> Space نيترو</div>
      <div class="touch-controls"><button class="touch-button" data-key="ArrowLeft">◀</button><button class="touch-button gas" data-key="ArrowUp">▲</button><button class="touch-button nitro" data-key=" ">N</button><button class="touch-button" data-key="ArrowRight">▶</button></div>
    </section>
    <footer class="bottom-panel"><span id="statusText">اختار الإعدادات ثم ابدأ</span><button id="backBtn" class="secondary-btn">الإعدادات</button></footer>
  </main>
  <script src="game-v5.js"></script>
</body>
</html>
